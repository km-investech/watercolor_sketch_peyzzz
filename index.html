<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>어반 스케치 변환기 (성근 선 버전)</title>
<style>
:root {
  --ink: #171411; --muted: #6f6a63; --line: #e2ddd5;
  --paper: #fbfaf6; --accent: #234b42;
  --radius: 8px;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh;
  font-family: Pretendard, system-ui, sans-serif;
  color: var(--ink); background: var(--paper);
}
.shell { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 32px 0; }
.top { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 22px; }
h1 { margin: 0; font-size: 28px; font-weight: 900; }
.toolbar { display: flex; gap: 8px; }
.btn {
  min-height: 42px; border: 1px solid var(--line); border-radius: var(--radius);
  padding: 0 16px; background: #fff; cursor: pointer; font-weight: 800;
}
.btn.primary { background: var(--ink); color: #fff; border: none; }
.upload {
  display: grid; grid-template-columns: 1fr 300px; gap: 18px;
  padding: 20px; border: 1px solid var(--line); border-radius: var(--radius); background: #fff;
}
.drop {
  border: 2px dashed #bbb2a7; border-radius: var(--radius);
  min-height: 250px; display: grid; place-items: center; cursor: pointer; position: relative;
}
.drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.workspace { display: none; margin-top: 20px; }
.workspace.on { display: block; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.card { border: 1px solid var(--line); border-radius: var(--radius); background: #fff; overflow: hidden; }
.stage { min-height: 350px; display: grid; place-items: center; background: #fdfcf8; position: relative; }
canvas, img { max-width: 100%; height: auto; display: none; }
.visible { display: block; }
.loader { display: none; position: absolute; inset: 0; background: rgba(255,255,255,0.8); place-items: center; z-index: 5; font-weight: bold; color: var(--accent); }
.loader.on { display: grid; }
</style>
</head>
<body>
<main class="shell">
  <section class="top">
    <div><h1>어반 스케치 변환 (성근 밑그림)</h1></div>
    <div class="toolbar">
      <button class="btn" id="resetBtn">새로 시작</button>
      <button class="btn primary" id="makeBtn" disabled>스케치 만들기</button>
    </div>
  </section>

  <section class="upload" id="uploadSection">
    <label class="drop" id="dropZone">
      <input type="file" id="fileInput" accept="image/*" />
      <strong>사진을 업로드하세요</strong>
    </label>
    <div style="padding:10px; font-size:13px; color:#666;">
      <h3>스케치 설정</h3>
      <p>• 선 밀도: 60 (성글게 조정)<br>• 발색: 1.6 (선명하게 유지)</p>
    </div>
  </section>

  <section class="workspace" id="workspace">
    <div class="grid">
      <div class="card"><div style="padding:10px; font-size:12px;">원본</div><div class="stage"><img id="originalImg" /></div></div>
      <div class="card"><div style="padding:10px; font-size:12px;">1. 펜 스케치 (성근 선)</div><div class="stage"><div id="sketchLoader" class="loader">선 따는 중...</div><canvas id="sketchCanvas"></canvas></div></div>
      <div class="card"><div style="padding:10px; font-size:12px;">2. 최종 담채화</div><div class="stage"><div id="finalLoader" class="loader">채색 중...</div><canvas id="finalCanvas"></canvas></div></div>
    </div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let sourceImage = null;

$("fileInput").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (event) => {
    sourceImage = new Image();
    sourceImage.onload = () => {
      $("originalImg").src = event.target.result;
      $("originalImg").classList.add("visible");
      $("uploadSection").style.display = "none";
      $("workspace").classList.add("on");
      $("makeBtn").disabled = false;
    };
    sourceImage.src = event.target.result;
  };
  reader.readAsDataURL(file);
});

$("makeBtn").addEventListener("click", async () => {
  $("makeBtn").disabled = true;
  $("sketchLoader").classList.add("on");
  await new Promise(r => setTimeout(r, 150));
  drawPenSketch();
  $("sketchLoader").classList.remove("on");

  $("finalLoader").classList.add("on");
  await new Promise(r => setTimeout(r, 150));
  drawWatercolorFinal();
  $("finalLoader").classList.remove("on");
  $("makeBtn").disabled = false;
});

$("resetBtn").addEventListener("click", () => location.reload());

// [수정] 선 밀도를 낮추고 큰 윤곽 위주로 추출하는 로직
function drawPenSketch() {
  const canvas = $("sketchCanvas");
  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  const scale = Math.min(1000/sourceImage.width, 1);
  canvas.width = sourceImage.width * scale;
  canvas.height = sourceImage.height * scale;
  ctx.drawImage(sourceImage, 0, 0, canvas.width, canvas.height);

  const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const pixels = imgData.data;
  const w = canvas.width;
  const h = canvas.height;
  
  const grayscale = new Uint8Array(w * h);
  for (let i = 0; i < pixels.length; i += 4) {
